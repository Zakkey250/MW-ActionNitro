[ActionNitro]
Enabled=1
; ObserveOnly=1 logs candidates without charging NOS.
ObserveOnly=0

; Optional read-only state API; physical sliding detection works without it.
OptionalArcadeDrift=1

[Rewards]
; 100 points = 0.3 seconds of installed NOS capacity. Provisional balance.
SecondsPerPoint=0.003
NearMiss=100
OncomingMiss=200
Jump=100
AirPerSecond=40
DriftPerSecond=50
NearMissChainStep=50
NearMissChainMaximum=200
DriftThreeSecondBonus=100
; Top speed: >=75% of performance estimate, stock HP cop baseline 4% tank/second.
; Oncoming lane core: 1pt/m. Slipstream: 2pt per qualified metre.
; Oncoming adapter uses native RNpf traffic lanes; intersections/unknown roads excluded.

[HUD]
Enabled=1
; auto follows WSF override, WSF saved settings, registry, then native language table.
; en, en-GB, fr, de, it, es, es-MX, nl, sv, da, fi, pl, ru, ja, ko, zh-TW, zh-CN, th
Language=auto
; Bottom-right offsets in a 1080-high reference canvas. Width also scales text.
Right=30
Bottom=25
Width=430

[Updates]
; Check GitHub once per launch on a worker. No downloads or auto-install.
Enabled=1
; auto uses the HUD language.
Language=auto
